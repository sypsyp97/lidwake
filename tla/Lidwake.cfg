\* Base configuration (SPEC 2b0ce82). The model always allows pmset children
\* that outlive a crashed parent, failed pmset calls in tick/stop/restore, and
\* nil reads of isSleepDisabled(). One assumption remains:
\*   UserRace = FALSE   the user does not run `pmset disablesleep 1` while
\*                      lidwake owns the flag (SPEC 8 "Known limitation")
SPECIFICATION Spec
CONSTANTS
    S = 2
    UserRace = FALSE
    Mutation = "none"
INVARIANTS
    TypeOK
    NoOrphanHold
    AssertionIffHold
PROPERTIES
    NeverClobberUser
    EventuallyRestored
